[package]
name = "omarchy-calendar-solver"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Internal one-shot scheduling adapter for Omarchy"
repository = "https://github.com/blackopsrepl/omarchy-calendar-solver"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
rrule = { version = "0.14", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solverforge = "=0.19.4"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
debug = 0
